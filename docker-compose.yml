services:
  simulator:
    build: ./simulator
    networks:
      - telemetry-net

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    depends_on:
      - simulator
    networks:
      - telemetry-net
    environment:
      - SIMULATOR_URL=ws://simulator:8765

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - telemetry-net

networks:
  telemetry-net:
    driver: bridge